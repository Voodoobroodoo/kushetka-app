<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Кушетка — рабочий кабинет массажиста и тренера: клиенты, запись, программы, питание, справочники и библиотека. Работает без интернета.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кушетка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161D1B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Кушетка</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#F7F8F5; --ink:#17201E; --ink-2:#48524F; --ink-3:#5E6966;
  --line:#DDE2DC; --line-2:#C4CCC5;
  --accent:#1C6E63; --accent-ink:#FFFFFF; --accent-soft:#DFEEEA; --accent-2:#B86B1E;
  --good:#1D7443; --good-bg:#E2F2E7; --warn:#835400; --warn-bg:#FAEFD6; --bad:#AE2E2E; --bad-bg:#FAE3E3; --info:#2A56AC; --info-bg:#E3EAF8;
  --shadow:0 1px 2px rgba(23,32,30,.05);
  --f-head:"Geologica","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px; --g:16px;
  --sv0:#1C8C7E; --sv0b:#DDF1EC; --sv1:#C8691F; --sv1b:#FBE7D5; --sv2:#2F6FB0; --sv2b:#DCE8F6; --sv3:#7D55B8; --sv3b:#EAE1F6; --sv4:#3C8A3F; --sv4b:#E0F0DF; --sv5:#C0476B; --sv5b:#F7DDE5; --sv6:#A67C00; --sv6b:#F7ECC8; --sv7:#5E6966; --sv7b:#E9ECEA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1412; --surface:#161D1B; --surface-2:#1B2421; --ink:#E4EBE8; --ink-2:#AAB6B1; --ink-3:#8C9993;
    --line:#27312E; --line-2:#38443F;
    --accent:#4FB3A3; --accent-ink:#0B1412; --accent-soft:#17312C; --accent-2:#E3A15A;
    --good:#5DCB8B; --good-bg:#14281C; --warn:#F0B45A; --warn-bg:#2D2410; --bad:#FF8A8A; --bad-bg:#351A1B; --info:#8FB0FF; --info-bg:#182139;
    --shadow:none;
    --sv0:#4FB3A3; --sv0b:#163530; --sv1:#E39A5A; --sv1b:#3A2616; --sv2:#7FA8E0; --sv2b:#172437; --sv3:#B393E6; --sv3b:#2A2038; --sv4:#7CC47F; --sv4b:#1A2D1B; --sv5:#E88AA5; --sv5b:#3A1B25; --sv6:#E3C15A; --sv6b:#332A10; --sv7:#AAB6B1; --sv7b:#232B28;
  }
  :root:not([data-theme="light"]) mark{ background:#6B5A12; }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1412; --surface:#161D1B; --surface-2:#1B2421; --ink:#E4EBE8; --ink-2:#AAB6B1; --ink-3:#8C9993;
  --line:#27312E; --line-2:#38443F;
  --accent:#4FB3A3; --accent-ink:#0B1412; --accent-soft:#17312C; --accent-2:#E3A15A;
  --good:#5DCB8B; --good-bg:#14281C; --warn:#F0B45A; --warn-bg:#2D2410; --bad:#FF8A8A; --bad-bg:#351A1B; --info:#8FB0FF; --info-bg:#182139;
  --shadow:none;
  --sv0:#4FB3A3; --sv0b:#163530; --sv1:#E39A5A; --sv1b:#3A2616; --sv2:#7FA8E0; --sv2b:#172437; --sv3:#B393E6; --sv3b:#2A2038; --sv4:#7CC47F; --sv4b:#1A2D1B; --sv5:#E88AA5; --sv5b:#3A1B25; --sv6:#E3C15A; --sv6b:#332A10; --sv7:#AAB6B1; --sv7b:#232B28;
}
@media (min-width:720px){ :root{ --g:24px; } }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{ background:var(--bg); color:var(--ink); font:15px/1.5 var(--f-body); -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--accent); text-underline-offset:3px; }
h1,h2,h3,h4{ font-family:var(--f-head); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.005em; }
.vh{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.num{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.muted{ color:var(--ink-3); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* shell */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line); }
.topbar-in{ display:flex; align-items:center; gap:12px 20px; flex-wrap:wrap; padding:10px var(--g); }
.brand{ display:flex; align-items:center; gap:10px; margin-right:auto; }
.brand svg{ width:34px; height:34px; flex:none; }
.lg-a{ fill:var(--accent); } .lg-b{ fill:var(--accent-2); } .lg-s{ fill:none; stroke:var(--ink-2); stroke-width:2.4; stroke-linecap:round; }
.brand b{ font-family:var(--f-head); font-weight:700; font-size:20px; letter-spacing:.01em; }
.brand span{ font-size:13px; color:var(--ink-3); }
.topnav{ display:flex; gap:4px; overflow-x:auto; overflow-y:hidden; }
.topnav button{ border:0; background:none; padding:8px 12px; border-radius:8px; font-weight:500; color:var(--ink-2); cursor:pointer; white-space:nowrap; }
.topnav button:hover{ background:var(--surface-2); color:var(--ink); }
.topnav button[aria-current="page"]{ background:var(--accent-soft); color:var(--accent); }
.storage{ font-size:12px; color:var(--ink-3); display:flex; align-items:center; gap:6px; white-space:nowrap; }
.storage i{ width:8px; height:8px; border-radius:50%; background:var(--ink-3); display:inline-block; }
.storage.cloud i{ background:var(--good); }
.storage.warn i{ background:var(--bad); }
.data-path{ margin:4px 0 0; } .data-path code{ font-size:13px; word-break:break-all; background:var(--surface-2); padding:3px 7px; border-radius:6px; border:1px solid var(--line); }
.data-q{ margin-top:12px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); display:grid; gap:8px; } .data-q code{ word-break:break-all; }
.bk-list{ display:grid; gap:2px; margin-top:10px; } .bk-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
.bk-row .btn{ flex:none; }
@media (max-width:720px){ .brand span, .storage{ display:none; } .topnav{ width:100%; } }

.shell{ display:grid; grid-template-columns:300px minmax(0,1fr); min-height:calc(100vh - 57px); }
.sidebar{ background:var(--surface-2); border-right:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:12px; position:sticky; top:57px; height:calc(100vh - 57px); overflow:auto; }
.main{ min-width:0; padding:20px var(--g) 40px; }
.main-in{ max-width:1120px; margin:0 auto; display:grid; gap:16px; }
@media (max-width:900px){
  .shell{ grid-template-columns:1fr; }
  .sidebar{ position:static; height:auto; border-right:0; padding:16px var(--g); }
  body[data-mode="client"] .sidebar{ display:none; }
  body[data-mode="list"] .main{ display:none; }
  body[data-mode="page"] .sidebar{ display:none; }
}
@media (min-width:901px){
  .only-mobile{ display:none!important; }
  .shell{ background:linear-gradient(90deg, var(--surface-2) 0 299px, var(--line) 299px 300px, transparent 300px); }
  .sidebar{ background:none; border-right:0; }
}
@media (max-width:420px){ .topnav{ gap:0; } .topnav button{ padding:8px 9px; font-size:14px; } }

/* sidebar */
.side-top{ display:flex; gap:8px; }
.side-top input{ flex:1; min-width:0; }
.clist{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.clist button{ width:100%; text-align:left; border:1px solid transparent; background:none; border-radius:10px; padding:10px 12px; cursor:pointer; display:grid; gap:2px; }
.clist button:hover{ background:var(--surface); border-color:var(--line); }
.clist button[aria-current="true"]{ background:var(--surface); border-color:var(--line-2); box-shadow:var(--shadow); }
.clist .nm{ font-weight:600; }
.clist .sub{ font-size:12.5px; color:var(--ink-3); }
.empty-side{ font-size:14px; color:var(--ink-3); padding:8px 4px; }

/* controls */
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=search],input[type=url],select,textarea{
  width:100%; min-width:0; height:40px; padding:0 12px; border:1px solid var(--line-2); border-radius:8px; background:var(--surface);
}
textarea{ height:auto; min-height:84px; padding:10px 12px; resize:vertical; line-height:1.45; }
input:focus,select:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:600; cursor:pointer; white-space:nowrap; }
.btn:hover{ filter:brightness(1.06); }
.btn.ghost{ background:var(--surface); color:var(--ink); border-color:var(--line-2); }
.btn.ghost:hover{ border-color:var(--ink-3); filter:none; }
.btn.danger{ background:var(--surface); color:var(--bad); border-color:var(--line-2); }
.btn.danger.solid{ background:var(--bad); color:#fff; border-color:var(--bad); }
.btn.sm{ height:32px; padding:0 10px; font-size:13.5px; }
.btnrow{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.field{ display:grid; gap:5px; min-width:0; }
.field > span{ font-size:13px; color:var(--ink-2); font-weight:500; }
.field small{ font-size:12px; color:var(--ink-3); }
.fgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr)); gap:12px 16px; }
.fgrid .wide{ grid-column:1/-1; }
.seg{ display:inline-flex; flex-wrap:wrap; gap:4px; padding:3px; border:1px solid var(--line-2); border-radius:10px; background:var(--surface); justify-self:start; max-width:100%; }
.seg label{ position:relative; }
.seg input{ position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
.seg span{ display:block; padding:6px 12px; border-radius:7px; font-size:14px; cursor:pointer; }
.seg input:checked + span{ background:var(--ink); color:var(--surface); }
.seg input:focus-visible + span{ outline:2px solid var(--accent); outline-offset:1px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chk{ position:relative; }
.chk input{ position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
.chk span{ display:inline-block; padding:6px 11px; border-radius:999px; border:1px solid var(--line-2); background:var(--surface); font-size:13.5px; cursor:pointer; }
.chk input:checked + span{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
.chk input:focus-visible + span{ outline:2px solid var(--accent); outline-offset:1px; }
.chk.med input:checked + span{ background:var(--warn-bg); border-color:var(--warn); color:var(--warn); }
.chips.col{ flex-direction:column; align-items:stretch; }
.chk.row span{ display:block; border-radius:10px; padding:8px 12px 8px 36px; position:relative; }
.chk.row span::before{ content:""; position:absolute; left:12px; top:11px; width:14px; height:14px; border-radius:4px; border:1.5px solid var(--line-2); background:var(--surface); }
.chk.row input:checked + span{ background:var(--bad-bg); border-color:var(--bad); color:var(--ink); font-weight:500; }
.chk.row input:checked + span::before{ background:var(--bad); border-color:var(--bad); }

/* surfaces */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:var(--shadow); display:grid; gap:12px; min-width:0; }
.card h3{ font-size:17px; }
.card h4{ font-size:15px; }
.card > p{ margin:0; }
.sub-h{ display:flex; align-items:baseline; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:16px; }
.kpis{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr)); gap:12px; }
.kpi{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:grid; gap:2px; }
.kpi .l{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); }
.kpi .v{ font-family:var(--f-head); font-size:26px; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums; }
.kpi .s{ font-size:12.5px; color:var(--ink-3); }
@media (max-width:560px){ .kpi .v{ font-size:22px; } .card{ padding:16px; } }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap; }
.pill.good{ background:var(--good-bg); color:var(--good); } .pill.warn{ background:var(--warn-bg); color:var(--warn); }
.pill.bad{ background:var(--bad-bg); color:var(--bad); } .pill.info{ background:var(--info-bg); color:var(--info); }
.pill.neutral{ background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); }
.list{ margin:0; padding:0; list-style:none; display:grid; gap:8px; }
.list li{ display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start; }
.dot{ width:10px; height:10px; border-radius:50%; margin-top:6px; flex:none; }
.dot.good{ background:var(--good); } .dot.warn{ background:var(--warn); } .dot.bad{ background:var(--bad); } .dot.info{ background:var(--info); }
.bul{ margin:0; padding-left:18px; display:grid; gap:4px; }
.bul li::marker{ color:var(--accent); }
.note{ font-size:13.5px; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.note.warn{ background:var(--warn-bg); border-color:transparent; color:var(--ink); }
.note.bad{ background:var(--bad-bg); border-color:transparent; color:var(--ink); }
.linkbtn{ border:0; background:none; padding:0; color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

/* client head + tabs */
.chead{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 16px; }
.chead h1{ font-size:clamp(24px,4vw,32px); }
.chead .meta{ margin:4px 0 0; color:var(--ink-3); font-size:14px; }
.ctabs{ display:flex; gap:2px; overflow-x:auto; overflow-y:hidden; border-bottom:1px solid var(--line); scrollbar-width:thin; }
.ctabs button{ border:0; background:none; padding:10px 12px; font-weight:500; color:var(--ink-2); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; }
.ctabs button:hover{ color:var(--ink); }
.ctabs button[aria-selected="true"]{ color:var(--accent); border-bottom-color:var(--accent); }
.subnav{ display:flex; gap:6px; flex-wrap:wrap; }
.subnav button{ border:1px solid var(--line-2); background:var(--surface); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:14px; }
.subnav button[aria-pressed="true"]{ background:var(--ink); color:var(--surface); border-color:var(--ink); }

/* tables */
.tw{ overflow-x:auto; overflow-y:hidden; border:1px solid var(--line); border-radius:10px; }
table{ width:100%; border-collapse:collapse; font-size:14px; }
th,td{ padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
th{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:600; background:var(--surface-2); white-space:nowrap; }
tr:last-child td{ border-bottom:0; }
td.n{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }

/* labs */
.labgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:10px 16px; }
.labin{ display:grid; grid-template-columns:1fr 96px; gap:4px 8px; align-items:center; }
.labin label{ font-size:13.5px; }
.labin small{ grid-column:1/-1; font-size:11.5px; color:var(--ink-3); margin-top:-2px; }
.labin input{ height:36px; text-align:right; font-family:var(--f-mono); }
.labin.st-hi input,.labin.st-lo input,.labin.st-warn input{ border-color:var(--warn); background:var(--warn-bg); }
.labin.st-crit input{ border-color:var(--bad); background:var(--bad-bg); }
.labin.st-ok input{ border-color:var(--good); }

/* training */
.week{ border:1px solid var(--line); border-radius:12px; background:var(--surface); }
.week > summary{ list-style:none; cursor:pointer; padding:14px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
.week > summary::-webkit-details-marker{ display:none; }
.week > summary h4{ font-size:16px; }
.week[open] > summary{ border-bottom:1px solid var(--line); }
.week .days{ padding:12px 16px 16px; display:grid; gap:14px; }
.day h5{ margin:0 0 6px; font-size:14.5px; font-family:var(--f-head); font-weight:600; }
.ex{ display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:4px 10px; padding:8px 0; border-top:1px dashed var(--line); align-items:start; }
.ex:first-of-type{ border-top:0; }
.ex .pair{ font-family:var(--f-mono); font-size:12.5px; color:var(--accent); font-weight:500; padding-top:2px; }
.ex .nm{ font-weight:600; }
.ex .alt{ font-size:12.5px; color:var(--ink-3); }
.ex .dose{ font-family:var(--f-mono); font-size:13px; text-align:right; white-space:nowrap; }
.ex .dose small{ display:block; color:var(--ink-3); font-family:var(--f-body); font-size:12px; }
@media (max-width:560px){ .ex{ grid-template-columns:36px minmax(0,1fr); } .ex .dose{ grid-column:2; text-align:left; white-space:normal; } }

/* charts */
.chart{ width:100%; height:auto; display:block; }
.ch-grid{ stroke:var(--line); stroke-width:1; }
.ch-txt{ fill:var(--ink-3); font:12px var(--f-body); }
.ch-txt.strong{ fill:var(--ink); font-weight:600; font-size:13px; }
.ch-line{ fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
.ch-area{ fill:var(--accent); opacity:.08; }
.ch-plan{ fill:none; stroke:var(--accent-2); stroke-width:2; stroke-dasharray:5 5; }
.ch-dot{ fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.ch-dot.last{ fill:var(--accent); }
.ch-bar{ fill:var(--accent); }
.ch-bar.soft{ fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; }
.ch-stem{ stroke:var(--line-2); stroke-width:3; stroke-linecap:round; }
.ch-before{ fill:var(--bad); } .ch-after{ fill:var(--good); }
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--ink-2); }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }

/* sessions */
.sess{ border:1px solid var(--line); border-radius:12px; background:var(--surface); }
.sess > summary{ list-style:none; cursor:pointer; padding:12px 16px; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
.sess > summary::-webkit-details-marker{ display:none; }
.sess[open] > summary{ border-bottom:1px solid var(--line); }
.sess .body{ padding:14px 16px 16px; display:grid; gap:12px; }
.tests-row{ display:grid; grid-template-columns:minmax(0,1fr) 84px 84px 32px; gap:6px 8px; align-items:center; }
.tests-row select{ height:34px; padding:0 6px; }

/* library, reference */
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:12px; }
.lib{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:grid; gap:6px; align-content:start; }
.lib h4{ font-size:15.5px; }
.lib .meta{ display:flex; gap:6px; flex-wrap:wrap; }
.lib p,.lib .p{ display:block; margin:0; font-size:14px; color:var(--ink-2); }
.lib .p.muted{ color:var(--ink-3); }
.main-in > h1{ font-size:clamp(24px,4vw,30px); }
.refitem{ border-top:1px solid var(--line); padding:12px 0; display:grid; gap:4px; }
.refitem:first-child{ border-top:0; padding-top:0; }
.refitem p{ margin:0; font-size:14px; color:var(--ink-2); }
.refitem b{ color:var(--ink); }

/* library */
.lib-form{ display:flex; gap:8px; }
.lib-form input{ flex:1; height:46px; font-size:16px; }
.lib-form .btn{ height:46px; }

  html.ios-app .sidebar{ height:calc(100dvh - 57px); }
}
/* iOS увеличивает страницу при вводе в поле со шрифтом меньше 16 px */
@media (pointer:coarse){
  html.ios-app input:not([type=checkbox]):not([type=radio]):not([type=range]), html.ios-app select, html.ios-app textarea{ font-size:16px; }

/* PDF поверх страницы — с учётом «чёлки» и полоски «Домой» */
html.ios-app .pdfov{ padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }

/* экран ожидания */
.ios-loader{ position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:var(--bg); padding:24px; }
.ios-loader-in{ display:grid; justify-items:center; gap:10px; text-align:center; max-width:340px; }

@keyframes ios-pulse{ 50%{ opacity:.45; } }
@media (prefers-reduced-motion:reduce){ .ios-loader svg{ animation:none; } }

/* полоса сообщений: обновление, установка на экран «Домой» */
.ios-bar{ position:sticky; top:0; z-index:40; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px var(--g);

</style>
</head>
