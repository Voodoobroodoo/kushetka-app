<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF — Кушетка</title>
<style>
:root{ --bg:#F2F3EF; --surface:#FFFFFF; --ink:#17201E; --ink-3:#5E6966; --line:#DDE2DC; --accent:#1C6E63; --accent-soft:#DFEEEA; color-scheme:light; }
@media (prefers-color-scheme: dark){ :root{ --bg:#0F1412; --surface:#161D1B; --ink:#E4EBE8; --ink-3:#8C9993; --line:#27312E; --accent:#4FB3A3; --accent-soft:#17312C; color-scheme:dark; } }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust:100%; }
.bar{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--line); }
.bar button{ min-width:40px; height:36px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; font-size:16px; }
.bar button:disabled{ opacity:.4; }
.bar label{ display:flex; align-items:center; gap:6px; color:var(--ink-3); }
.bar input{ width:4.2em; height:36px; padding:0 6px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-size:16px; text-align:center; }
.sp{ flex:1; }
#st{ color:var(--ink-3); font-size:13px; }
#wrap{ overflow:auto; -webkit-overflow-scrolling:touch; padding:12px 12px calc(24px + env(safe-area-inset-bottom)); }
#page{ margin:0 auto; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.18); display:block; }
.msg{ max-width:520px; margin:40px auto; padding:0 16px; text-align:center; color:var(--ink-3); }
.msg a{ color:var(--accent); }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Страницы">
  <button type="button" id="prev" aria-label="Предыдущая страница">←</button>
  <label>стр. <input id="pg" type="number" inputmode="numeric" min="1" value="1" aria-label="Номер страницы"> <span id="of"></span></label>
  <button type="button" id="next" aria-label="Следующая страница">→</button>
  <span class="sp"></span>
  <button type="button" id="zo" aria-label="Мельче">−</button>
  <button type="button" id="fit" aria-label="По ширине">↔</button>
  <button type="button" id="zi" aria-label="Крупнее">+</button>
</div>
<div id="st" style="padding:6px 12px" role="status"></div>
<div id="wrap"><canvas id="page" aria-label="Страница PDF"></canvas></div>
<script type="module">
/* Просмотр PDF в iPhone-версии Кушетки: PDF.js берёт с Google Диска только нужные куски файла
   (через service worker, ./_h/lib/pdf/<id> с заголовком Range), прочитанные куски остаются в кэше. */
import * as pdfjs from "./pdf/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "./pdf/pdf.worker.min.mjs";
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const id = qs.get("id") || "", H = new URL("./_h/", location.href).href;
const st = $("#st"), cv = $("#page"), wrap = $("#wrap");
let doc = null, num = Math.max(1, parseInt(qs.get("p") || "1", 10) || 1), zoom = 1, busy = null, want = 0;
function fail(msg, view){ st.textContent = ""; wrap.innerHTML = `<p class="msg">${msg}${view ? `<br><br><a href="${view}" target="_blank" rel="noopener">Открыть на Google Диске ↗</a>` : ""}</p>`; }
async function main(){
  if (!/^m[0-9a-f]{7}$/.test(id)) return fail("Не указана книга.");
  st.textContent = "Открываю PDF…";
  let info;
  try { const r = await fetch(H + "lib/pdf/" + id + "?t=ios&info=1"); if (!r.ok) throw new Error(await r.text()); info = await r.json(); }
  catch (e){ return fail("PDF этой книги недоступен: " + (e.message || e)); }
  class Range extends pdfjs.PDFDataRangeTransport {
    requestDataRange(begin, end){
      fetch(H + "lib/pdf/" + id + "?t=ios", {headers: {Range: "bytes=" + begin + "-" + (end - 1)}})
        .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.arrayBuffer(); })
        .then(b => this.onDataRange(begin, new Uint8Array(b)))
        .catch(e => fail("Нет связи с Google Диском: " + (e.message || e) + ". Прочитанные раньше страницы открываются и без интернета.", info.view));
    }
  }
  try {
    doc = await pdfjs.getDocument({range: new Range(info.size, null), rangeChunkSize: 1 << 20, disableAutoFetch: true, disableStream: true,
      standardFontDataUrl: "./pdf/standard_fonts/", wasmUrl: "./pdf/wasm/", isEvalSupported: false, enableXfa: false}).promise;
  } catch (e){ return fail("Не получилось открыть PDF: " + (e.message || e), info.view); }
  $("#of").textContent = "из " + doc.numPages;
  $("#pg").max = doc.numPages;
  num = Math.min(num, doc.numPages);
  show(num);
}
async function show(n){
  if (!doc) return;
  num = Math.min(Math.max(1, n), doc.numPages);
  $("#pg").value = num; $("#prev").disabled = num <= 1; $("#next").disabled = num >= doc.numPages;
  want = num;
  if (busy) { try { busy.cancel(); } catch (e){} }
  st.textContent = "Загружаю страницу " + num + "…";
  try {
    const page = await doc.getPage(num);
    if (want !== num) return;
    const w = Math.max(200, wrap.clientWidth - 24), base = page.getViewport({scale: 1});
    const css = w / base.width * zoom, dpr = Math.min(window.devicePixelRatio || 1, 3);
    const vp = page.getViewport({scale: css * dpr});
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    cv.style.width = Math.floor(vp.width / dpr) + "px"; cv.style.height = Math.floor(vp.height / dpr) + "px";
    busy = page.render({canvasContext: cv.getContext("2d"), viewport: vp});
    await busy.promise; busy = null;
    st.textContent = "";
  } catch (e){
    if (e && e.name === "RenderingCancelledException") return;
    st.textContent = "Не получилось показать страницу: " + (e.message || e);
  }
}
$("#prev").onclick = () => { show(num - 1); wrap.scrollTop = 0; window.scrollTo(0, 0); };
$("#next").onclick = () => { show(num + 1); wrap.scrollTop = 0; window.scrollTo(0, 0); };
$("#pg").onchange = e => show(parseInt(e.target.value, 10) || 1);
$("#zi").onclick = () => { zoom = Math.min(4, zoom * 1.25); show(num); };
$("#zo").onclick = () => { zoom = Math.max(0.5, zoom / 1.25); show(num); };
$("#fit").onclick = () => { zoom = 1; show(num); };
let rt = null; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => show(num), 250); });
main();
</script>
</body>
</html>
